name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^e: |What went wrong|Caused by|Unsupported|Error in|ERROR" -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::${l}"; done
          fi
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: WLandroid-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Pubblica la release su GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk "WLandroid-${TAG}.apk"
          MSG=$(git log -1 --pretty=%s)
          gh release create "$TAG" "WLandroid-${TAG}.apk" \
            --title "WLandroid ${TAG}" \
            --notes "$MSG" \
            --target "${{ github.sha }}" \
            --latest
